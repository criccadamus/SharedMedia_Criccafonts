name: CI

on:
  pull_request:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    name: Lua syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Luacheck
        uses: BigWigsMods/actions/luacheck@master
        with:
          args: -q

  release:
    name: Package addon
    needs: lint
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: packager
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # One archive per game version. The suffixes are what Wago's release
      # webhook uses to decide which game version an asset belongs to.
      - name: Build retail
        uses: BigWigsMods/packager@master
        with:
          args: -d -g retail

      - name: Build Classic Era
        uses: BigWigsMods/packager@master
        with:
          args: -d -g classic

      - name: Build Forever
        uses: BigWigsMods/packager@master
        with:
          args: -d -g forever

      - name: Build Burning Crusade Classic
        uses: BigWigsMods/packager@master
        with:
          args: -d -g bcc

      - name: Build Wrath Classic
        uses: BigWigsMods/packager@master
        with:
          args: -d -g wrath

      - name: Build Cataclysm Classic
        uses: BigWigsMods/packager@master
        with:
          args: -d -g cata

      - name: Build Mists Classic
        uses: BigWigsMods/packager@master
        with:
          args: -d -g mists

      - name: Show archives
        run: ls -lh .release/*.zip

      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: SharedMedia_Criccafonts
          path: .release/*.zip
          if-no-files-found: error

      # Publish every flavor in a single release event. Wago's webhook reads
      # the assets when the release is published, so they must all be present
      # in the same API call.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=".release/SharedMedia_Criccafonts/CHANGELOG.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" .release/*.zip --clobber
            if [ -f "$notes" ]; then
              gh release edit "$TAG" --notes-file "$notes"
            fi
          elif [ -f "$notes" ]; then
            gh release create "$TAG" .release/*.zip --verify-tag --notes-file "$notes"
          else
            gh release create "$TAG" .release/*.zip --verify-tag --generate-notes
          fi
